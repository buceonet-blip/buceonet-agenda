name: Build Buceonet Agenda APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Buceonet_Agenda_APK_proyecto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o Buceonet_Agenda_APK_proyecto.zip

      - name: Add native WhatsApp Business integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("buceonet_apk/app/src/main")
          java = root / "java/com/buceonet/agenda/MainActivity.java"
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text("""package com.buceonet.agenda;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String AGENDA_URL = "https://buceonet-blip.github.io/buceonet-agenda/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUrl(request.getUrl().toString());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUrl(url);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  if (savedInstanceState == null) webView.loadUrl(AGENDA_URL);
                  else webView.restoreState(savedInstanceState);
              }

              private boolean handleExternalUrl(String url) {
                  Uri uri = Uri.parse(url);
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
                  String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();
                  boolean whatsapp = scheme.equals("whatsapp") ||
                      host.equals("wa.me") || host.equals("api.whatsapp.com") ||
                      host.equals("chat.whatsapp.com");
                  if (!whatsapp) return false;

                  Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                  try {
                      intent.setPackage("com.whatsapp.w4b");
                      startActivity(intent);
                      return true;
                  } catch (ActivityNotFoundException ignored) { }
                  try {
                      intent.setPackage("com.whatsapp");
                      startActivity(intent);
                      return true;
                  } catch (ActivityNotFoundException ignored) { }
                  try {
                      intent.setPackage(null);
                      startActivity(intent);
                  } catch (ActivityNotFoundException ignored) { }
                  return true;
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          """)
          manifest = root / "AndroidManifest.xml"
          xml = manifest.read_text()
          if "<queries>" not in xml:
              xml = xml.replace("<application", """<queries>
                  <package android:name="com.whatsapp.w4b" />
                  <package android:name="com.whatsapp" />
              </queries>
              <application""", 1)
          # Explicitly point both launcher entry points to the generated icon resources.
          xml = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', xml, count=1)
          if 'android:icon=' not in xml:
              xml = re.sub(r'<application\\b', '<application android:icon="@mipmap/ic_launcher"', xml, count=1)
          if re.search(r'android:roundIcon="[^"]+"', xml):
              xml = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', xml, count=1)
          else:
              xml = re.sub(r'<application\\b', '<application android:roundIcon="@mipmap/ic_launcher_round"', xml, count=1)
          manifest.write_text(xml)
          PY

      - name: Inspect Android activity and manifest
        run: |
          echo '--- MAIN ACTIVITY ---'
          cat buceonet_apk/app/src/main/java/com/buceonet/agenda/MainActivity.java
          echo '--- MANIFEST ---'
          cat buceonet_apk/app/src/main/AndroidManifest.xml

      - name: Create safe-zone black and gold Buceonet Agenda launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-dejavu-core
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          root = Path("buceonet_apk/app/src/main/res")
          gold = (229, 181, 66, 255)
          S = 432

          def build_icon():
              im = Image.new("RGBA", (S,S), (0,0,0,0))
              d = ImageDraw.Draw(im)
              # Everything stays inside the central adaptive-icon safe area (roughly 66%).
              # Compact calendar in the upper half.
              d.rounded_rectangle((142,82,290,202), radius=13, outline=gold, width=8)
              d.line((142,119,290,119), fill=gold, width=7)
              d.line((178,68,178,96), fill=gold, width=9)
              d.line((254,68,254,96), fill=gold, width=9)
              for x,y in [(168,139),(211,139),(254,139),(168,170),(211,170)]:
                  d.rounded_rectangle((x,y,x+14,y+14), radius=3, fill=gold)
              # Brand lettering, centered and comfortably inside safe zone.
              font1 = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 29)
              font2 = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 34)
              for label, y, font in [("BUCEONET",224,font1),("AGENDA",268,font2)]:
                  box = d.textbbox((0,0), label, font=font, stroke_width=0)
                  x = (S - (box[2]-box[0])) // 2
                  d.text((x,y), label, font=font, fill=gold)
              return im

          art = build_icon()
          # Use a distinct resource name so an old vector drawable cannot override the new PNG.
          (root / "drawable-nodpi").mkdir(parents=True, exist_ok=True)
          art.save(root / "drawable-nodpi/ic_buceonet_agenda_foreground.png")

          # Legacy launchers receive the complete square icon.
          legacy_dir = root / "mipmap-nodpi"
          legacy_dir.mkdir(parents=True, exist_ok=True)
          square = Image.new("RGBA", (512,512), (5,5,5,255))
          square.alpha_composite(art.resize((512,512), Image.Resampling.LANCZOS))
          for name in ("ic_launcher.png", "ic_launcher_round.png"):
              square.convert("RGB").save(legacy_dir / name)

          values = root / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#050505</color></resources>\n'
          )
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_buceonet_agenda_foreground"/>
          </adaptive-icon>
          '''
          v26 = root / "mipmap-anydpi-v26"
          v26.mkdir(parents=True, exist_ok=True)
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (v26 / name).write_text(adaptive)
          print("Launcher artwork and BUCEONET AGENDA text fit within adaptive safe zone.")
          PY

      - name: Verify shared WhatsApp features in the web app loaded by Android
        run: |
          grep -q 'businessNameForEmail' index.html
          grep -q 'isAppointmentOwner' index.html
          grep -q 'wa.me' index.html
          grep -q 'https://buceonet-blip.github.io/buceonet-agenda/' buceonet_apk/app/src/main/java/com/buceonet/agenda/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p buceonet_apk assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buceonet-Agenda-APK
          path: buceonet_apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
