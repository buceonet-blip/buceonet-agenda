name: Build Buceonet Agenda APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Buceonet_Agenda_APK_proyecto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o Buceonet_Agenda_APK_proyecto.zip

      - name: Add native WhatsApp Business integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("buceonet_apk/app/src/main")
          java = root / "java/com/buceonet/agenda/MainActivity.java"
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text("""package com.buceonet.agenda;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String AGENDA_URL = "https://buceonet-blip.github.io/buceonet-agenda/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUrl(request.getUrl().toString());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUrl(url);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  if (savedInstanceState == null) webView.loadUrl(AGENDA_URL);
                  else webView.restoreState(savedInstanceState);
              }

              private boolean handleExternalUrl(String url) {
                  Uri uri = Uri.parse(url);
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
                  String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();
                  boolean whatsapp = scheme.equals("whatsapp") ||
                      host.equals("wa.me") || host.equals("api.whatsapp.com") ||
                      host.equals("chat.whatsapp.com");
                  if (!whatsapp) return false;

                  Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                  try {
                      intent.setPackage("com.whatsapp.w4b");
                      startActivity(intent);
                      return true;
                  } catch (ActivityNotFoundException ignored) { }
                  try {
                      intent.setPackage("com.whatsapp");
                      startActivity(intent);
                      return true;
                  } catch (ActivityNotFoundException ignored) { }
                  try {
                      intent.setPackage(null);
                      startActivity(intent);
                  } catch (ActivityNotFoundException ignored) { }
                  return true;
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          """)
          manifest = root / "AndroidManifest.xml"
          xml = manifest.read_text()
          if "<queries>" not in xml:
              xml = xml.replace("<application", """<queries>
                  <package android:name="com.whatsapp.w4b" />
                  <package android:name="com.whatsapp" />
              </queries>
              <application""", 1)
          manifest.write_text(xml)
          PY

      - name: Inspect Android activity and manifest
        run: |
          echo '--- MAIN ACTIVITY ---'
          cat buceonet_apk/app/src/main/java/com/buceonet/agenda/MainActivity.java
          echo '--- MANIFEST ---'
          cat buceonet_apk/app/src/main/AndroidManifest.xml

      - name: Install proper Android launcher icons (legacy + adaptive)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("buceonet_apk/app/src/main")
          manifest = root / "AndroidManifest.xml"
          xml = manifest.read_text(encoding="utf-8")

          # Use mipmap resources, not a drawable-only launcher icon.
          match = re.search(r"<application\b[^>]*>", xml, flags=re.S)
          if not match:
              raise SystemExit("No se encontró la etiqueta <application> en AndroidManifest.xml")
          tag = match.group(0)
          tag = re.sub(r'\s+android:(?:icon|roundIcon)="[^"]*"', "", tag)
          tag = tag[:-1] + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          xml = xml[:match.start()] + tag + xml[match.end():]
          manifest.write_text(xml, encoding="utf-8")

          res = root / "res"
          (res / "values").mkdir(parents=True, exist_ok=True)
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          (res / "mipmap-anydpi").mkdir(parents=True, exist_ok=True)
          (res / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)

          (res / "values/ic_launcher_colors.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050505</color>
          </resources>
          """, encoding="utf-8")

          # Foreground only: Android applies the black adaptive-icon background.
          (res / "drawable/ic_launcher_foreground.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:scaleX="0.72" android:scaleY="0.72" android:pivotX="54" android:pivotY="54">
              <path android:strokeColor="#D9A52B" android:strokeWidth="3"
                  android:fillColor="#00000000"
                  android:pathData="M23,29h62v53h-62z M36,21v16 M72,21v16"/>
              <path android:fillColor="#F4C64E"
                  android:pathData="M32,43h8v8h-8z M50,43h8v8h-8z M68,43h8v8h-8z M32,59h8v8h-8z M50,59h8v8h-8z"/>
              <path android:fillColor="#050505" android:strokeColor="#F4C64E"
                  android:strokeWidth="3.5"
                  android:pathData="M72,57a19,19 0,1 0,0.1 0z"/>
              <path android:strokeColor="#F4C64E" android:strokeWidth="3.5"
                  android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M72,63v-13 M72,63l9,-8"/>
              </group>
          </vector>
          """, encoding="utf-8")

          # Legacy launchers (API 21+) get a complete vector icon.
          legacy = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#050505" android:pathData="M0,0h108v108h-108z"/>
              <group android:scaleX="0.72" android:scaleY="0.72" android:pivotX="54" android:pivotY="54">
              <path android:strokeColor="#D9A52B" android:strokeWidth="3"
                  android:fillColor="#101010"
                  android:pathData="M12,8h84v92h-84z"/>
              <path android:strokeColor="#F4C64E" android:strokeWidth="3"
                  android:fillColor="#00000000"
                  android:pathData="M23,29h62v53h-62z M36,21v16 M72,21v16"/>
              <path android:fillColor="#F4C64E"
                  android:pathData="M32,43h8v8h-8z M50,43h8v8h-8z M68,43h8v8h-8z M32,59h8v8h-8z M50,59h8v8h-8z"/>
              <path android:fillColor="#050505" android:strokeColor="#F4C64E"
                  android:strokeWidth="3.5"
                  android:pathData="M72,57a19,19 0,1 0,0.1 0z"/>
              <path android:strokeColor="#F4C64E" android:strokeWidth="3.5"
                  android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M72,63v-13 M72,63l9,-8"/>
              </group>
          </vector>
          """
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (res / "mipmap-anydpi" / name).write_text(legacy, encoding="utf-8")

          adaptive = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (res / "mipmap-anydpi-v26" / name).write_text(adaptive, encoding="utf-8")

          print("Manifest launcher icon:", re.search(r'android:icon="([^"]+)"', tag).group(1))
          print("Adaptive and legacy mipmap resources created.")
          PY

      - name: Verify shared WhatsApp features in the web app loaded by Android
        run: |
          grep -q 'businessNameForEmail' index.html
          grep -q 'isAppointmentOwner' index.html
          grep -q 'wa.me' index.html
          grep -q 'https://buceonet-blip.github.io/buceonet-agenda/' buceonet_apk/app/src/main/java/com/buceonet/agenda/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p buceonet_apk assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buceonet-Agenda-APK
          path: buceonet_apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
