name: Build Buceonet Agenda APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Buceonet_Agenda_APK_proyecto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o Buceonet_Agenda_APK_proyecto.zip

      - name: Add native WhatsApp Business integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("buceonet_apk/app/src/main")
          java = root / "java/com/buceonet/agenda/MainActivity.java"
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text("""package com.buceonet.agenda;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String AGENDA_URL = "https://buceonet-blip.github.io/buceonet-agenda/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUrl(request.getUrl().toString());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUrl(url);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  if (savedInstanceState == null) webView.loadUrl(AGENDA_URL);
                  else webView.restoreState(savedInstanceState);
              }

              private boolean handleExternalUrl(String url) {
                  Uri uri = Uri.parse(url);
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
                  String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();
                  boolean whatsapp = scheme.equals("whatsapp") ||
                      host.equals("wa.me") || host.equals("api.whatsapp.com") ||
                      host.equals("chat.whatsapp.com");
                  if (!whatsapp) return false;

                  Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                  try {
                      intent.setPackage("com.whatsapp.w4b");
                      startActivity(intent);
                      return true;
                  } catch (ActivityNotFoundException ignored) { }
                  try {
                      intent.setPackage("com.whatsapp");
                      startActivity(intent);
                      return true;
                  } catch (ActivityNotFoundException ignored) { }
                  try {
                      intent.setPackage(null);
                      startActivity(intent);
                  } catch (ActivityNotFoundException ignored) { }
                  return true;
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          """)
          manifest = root / "AndroidManifest.xml"
          xml = manifest.read_text()
          if "<queries>" not in xml:
              xml = xml.replace("<application", """<queries>
                  <package android:name="com.whatsapp.w4b" />
                  <package android:name="com.whatsapp" />
              </queries>
              <application""", 1)
          manifest.write_text(xml)
          PY

      - name: Inspect Android activity and manifest
        run: |
          echo '--- MAIN ACTIVITY ---'
          cat buceonet_apk/app/src/main/java/com/buceonet/agenda/MainActivity.java
          echo '--- MANIFEST ---'
          cat buceonet_apk/app/src/main/AndroidManifest.xml

      - name: Install Buceonet black and gold launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("buceonet_apk/app/src/main")
          manifest = root / "AndroidManifest.xml"
          xml = manifest.read_text()
          start = xml.index("<application")
          end = xml.index(">", start)
          tag = xml[start:end]
          tag = re.sub('android:icon="[^"]*"', "", tag)
          tag += ' android:icon="@drawable/ic_launcher"'
          xml = xml[:start] + tag + xml[end:]
          res = root / "res/drawable"
          res.mkdir(parents=True, exist_ok=True)
          (res / "ic_launcher.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#050505" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#D9A52B" android:strokeWidth="2.5" android:fillColor="#101010"
                  android:pathData="M12,5h84a7,7 0,0 1,7 7v84a7,7 0,0 1,-7 7h-84a7,7 0,0 1,-7 -7v-84a7,7 0,0 1,7 -7z"/>
              <path android:strokeColor="#F4C64E" android:strokeWidth="4" android:strokeLineCap="round"
                  android:strokeLineJoin="round" android:fillColor="#00000000"
                  android:pathData="M24,27h60v49h-60z M36,19v14 M72,19v14"/>
              <path android:fillColor="#E9B83E" android:pathData="M31,40h8v7h-8z M49,40h8v7h-8z M67,40h8v7h-8z M31,54h8v7h-8z M49,54h8v7h-8z"/>
              <path android:fillColor="#080808" android:strokeColor="#F4C64E" android:strokeWidth="3"
                  android:pathData="M72,55a22,22 0,1 0,0.1 0z"/>
              <path android:strokeColor="#F4C64E" android:strokeWidth="3.5" android:strokeLineCap="round"
                  android:pathData="M72,62v-12 M72,62l9,-8"/>
              <path android:fillColor="#F4C64E" android:pathData="M70,60a2,2 0,1 0,4 0a2,2 0,1 0,-4 0"/>
          </vector>
          """)
          PY

      - name: Verify shared WhatsApp features in the web app loaded by Android
        run: |
          grep -q 'businessNameForEmail' index.html
          grep -q 'isAppointmentOwner' index.html
          grep -q 'wa.me' index.html
          grep -q 'https://buceonet-blip.github.io/buceonet-agenda/' buceonet_apk/app/src/main/java/com/buceonet/agenda/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p buceonet_apk assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buceonet-Agenda-APK
          path: buceonet_apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
