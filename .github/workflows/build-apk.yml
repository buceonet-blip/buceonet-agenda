name: Build Buceonet Agenda APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Buceonet_Agenda_APK_proyecto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o Buceonet_Agenda_APK_proyecto.zip

      - name: Add native WhatsApp Business integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("buceonet_apk/app/src/main")
          java = root / "java/com/buceonet/agenda/MainActivity.java"
          java.parent.mkdir(parents=True, exist_ok=True)
          java.write_text("""package com.buceonet.agenda;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String AGENDA_URL = "https://buceonet-blip.github.io/buceonet-agenda/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUrl(request.getUrl().toString());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUrl(url);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  if (savedInstanceState == null) webView.loadUrl(AGENDA_URL);
                  else webView.restoreState(savedInstanceState);
              }

              private boolean handleExternalUrl(String url) {
                  Uri uri = Uri.parse(url);
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
                  String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();
                  boolean whatsapp = scheme.equals("whatsapp") ||
                      host.equals("wa.me") || host.equals("api.whatsapp.com") ||
                      host.equals("chat.whatsapp.com");
                  if (!whatsapp) return false;

                  Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                  try {
                      intent.setPackage("com.whatsapp.w4b");
                      startActivity(intent);
                      return true;
                  } catch (ActivityNotFoundException ignored) { }
                  try {
                      intent.setPackage("com.whatsapp");
                      startActivity(intent);
                      return true;
                  } catch (ActivityNotFoundException ignored) { }
                  try {
                      intent.setPackage(null);
                      startActivity(intent);
                  } catch (ActivityNotFoundException ignored) { }
                  return true;
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          """)
          manifest = root / "AndroidManifest.xml"
          xml = manifest.read_text()
          if "<queries>" not in xml:
              xml = xml.replace("<application", """<queries>
                  <package android:name="com.whatsapp.w4b" />
                  <package android:name="com.whatsapp" />
              </queries>
              <application""", 1)
          manifest.write_text(xml)
          PY

      - name: Inspect Android activity and manifest
        run: |
          echo '--- MAIN ACTIVITY ---'
          cat buceonet_apk/app/src/main/java/com/buceonet/agenda/MainActivity.java
          echo '--- MANIFEST ---'
          cat buceonet_apk/app/src/main/AndroidManifest.xml

      - name: Create visible black and gold Buceonet Agenda launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-dejavu-core
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          root = Path("buceonet_apk/app/src/main/res")
          gold = (225, 174, 55, 255)
          transparent = (0, 0, 0, 0)

          def make_art(size):
              scale = size / 432
              im = Image.new("RGBA", (size, size), transparent)
              d = ImageDraw.Draw(im)
              def p(v): return int(round(v * scale))
              # Calendar body and top rings, deliberately inside Android's adaptive safe zone.
              d.rounded_rectangle((p(119),p(48),p(313),p(230)), radius=p(18), outline=gold, width=p(9))
              d.line((p(119),p(102),p(313),p(102)), fill=gold, width=p(8))
              d.line((p(164),p(34),p(164),p(73)), fill=gold, width=p(10))
              d.line((p(268),p(34),p(268),p(73)), fill=gold, width=p(10))
              # Calendar date marks
              for x,y in [(155,132),(210,132),(265,132),(155,177),(210,177)]:
                  d.rounded_rectangle((p(x),p(y),p(x+20),p(y+20)), radius=p(4), fill=gold)
              # Clear, centered brand name
              f1 = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", p(34))
              f2 = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", p(38))
              for label, y, font in [("BUCEONET", 258, f1), ("AGENDA", 310, f2)]:
                  box = d.textbbox((0,0), label, font=font, stroke_width=0)
                  x = (size - (box[2]-box[0])) // 2
                  d.text((x,p(y)), label, font=font, fill=gold)
              return im

          # Adaptive foreground: transparent edges, with all artwork in the safe center.
          fgdir = root / "drawable-nodpi"
          fgdir.mkdir(parents=True, exist_ok=True)
          make_art(432).save(fgdir / "ic_launcher_foreground.png")

          # Legacy launcher icon: full black square with the same gold artwork.
          mip = root / "mipmap-nodpi"
          mip.mkdir(parents=True, exist_ok=True)
          for name in ("ic_launcher.png", "ic_launcher_round.png"):
              base = Image.new("RGBA", (512,512), (5,5,5,255))
              art = make_art(432).resize((512,512), Image.Resampling.LANCZOS)
              base.alpha_composite(art)
              base.convert("RGB").save(mip / name)

          (root / "values").mkdir(parents=True, exist_ok=True)
          (root / "values/ic_launcher_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\\n<resources><color name="ic_launcher_background">#050505</color></resources>\\n'
          )
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          v26 = root / "mipmap-anydpi-v26"
          v26.mkdir(parents=True, exist_ok=True)
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (v26 / name).write_text(adaptive)
          print("Icono negro y oro creado con BUCEONET AGENDA visible.")
          PY

      - name: Verify shared WhatsApp features in the web app loaded by Android
        run: |
          grep -q 'businessNameForEmail' index.html
          grep -q 'isAppointmentOwner' index.html
          grep -q 'wa.me' index.html
          grep -q 'https://buceonet-blip.github.io/buceonet-agenda/' buceonet_apk/app/src/main/java/com/buceonet/agenda/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p buceonet_apk assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buceonet-Agenda-APK
          path: buceonet_apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
